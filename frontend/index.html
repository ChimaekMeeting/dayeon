<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>루디 (Roudi)</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d1117;
      --panel:   #161b22;
      --border:  #21262d;
      --accent:  #39d353;
      --accent2: #58a6ff;
      --text:    #e6edf3;
      --muted:   #7d8590;
      --danger:  #f85149;
    }

    html, body { height: 100%; font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

    #app { display: flex; height: 100vh; width: 100vw; }

    #sidebar {
      width: 400px; min-width: 360px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      z-index: 10; overflow: hidden;
    }

    #map-container { flex: 1; position: relative; }
    #map { width: 100%; height: 100%; }

    /* ── 헤더 ── */
    .sidebar-header {
      padding: 22px 24px 18px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .logo { font-family: 'Bebas Neue', sans-serif; font-size: 36px; letter-spacing: 3px; color: var(--accent); line-height: 1; }
    .logo-sub { font-size: 11px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; }

    /* ── 본문 ── */
    .sidebar-body {
      flex: 1; overflow-y: auto;
      padding: 20px 24px;
      display: flex; flex-direction: column; gap: 16px;
    }
    .sidebar-body::-webkit-scrollbar { width: 4px; }
    .sidebar-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .section-label {
      font-size: 11px; font-weight: 500;
      color: var(--muted); letter-spacing: 1.5px;
      text-transform: uppercase; margin-bottom: 4px;
    }

    .input-block { display: flex; flex-direction: column; gap: 6px; }

    /* ── 루트 유형 버튼 ── */
    .route-types { display: flex; gap: 8px; }
    .type-btn {
      flex: 1; background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 8px; color: var(--muted);
      font-family: 'Noto Sans KR', sans-serif; font-size: 12px;
      cursor: pointer; text-align: center; transition: all .15s;
    }
    .type-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(57,211,83,.08); }
    .type-btn:hover:not(.active) { border-color: #444d56; color: var(--text); }
    .type-icon { font-size: 18px; display: block; margin-bottom: 4px; }

    /* ── 입력창 ── */
    textarea {
      width: 100%; background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-family: 'Noto Sans KR', sans-serif;
      font-size: 14px; line-height: 1.6;
      padding: 12px 14px; resize: none; outline: none;
      transition: border-color .2s;
    }
    textarea::placeholder { color: var(--muted); }
    textarea:focus { border-color: var(--accent); }

    #nlInput { height: 90px; }

    /* ── 목적지 입력 (waypoint 전용) ── */
    #destinationBlock { display: none; }
    #destinationBlock.visible { display: flex; }
    #destinationInput { height: 44px; }

    /* ── 예시 칩 ── */
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 20px; padding: 4px 12px;
      font-size: 12px; color: var(--muted);
      cursor: pointer; transition: all .15s; white-space: nowrap;
    }
    .chip:hover { border-color: var(--accent); color: var(--accent); }

    /* ── 실행 버튼 ── */
    #runBtn {
      width: 100%; background: var(--accent);
      border: none; border-radius: 8px;
      color: #0d1117; font-family: 'Noto Sans KR', sans-serif;
      font-weight: 700; font-size: 14px;
      padding: 13px; cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    #runBtn:hover { opacity: .88; }
    #runBtn:active { transform: scale(.98); }
    #runBtn:disabled { opacity: .4; cursor: not-allowed; }

    /* ── 로딩 ── */
    #loader { display: none; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
    #loader.visible { display: flex; }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── 오류 ── */
    #errorMsg { display: none; background: rgba(248,81,73,.1); border: 1px solid rgba(248,81,73,.3); border-radius: 8px; padding: 10px 14px; font-size: 12px; color: var(--danger); }
    #errorMsg.visible { display: block; }

    /* ── 결과 ── */
    #resultSection { display: none; flex-direction: column; gap: 14px; }
    #resultSection.visible { display: flex; }

    .divider { height: 1px; background: var(--border); }

    /* LLM 설명 */
    .reply-box {
      background: var(--bg); border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 0 8px 8px 0;
      padding: 12px 14px; font-size: 13px;
      line-height: 1.7; color: var(--text);
    }

    /* 루트 옵션 */
    .route-options { display: flex; flex-direction: column; gap: 6px; }
    .route-option {
      display: flex; align-items: center; gap: 10px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 12px;
      cursor: pointer; transition: all .15s;
    }
    .route-option:hover { border-color: var(--accent2); }
    .route-option.selected { border-color: var(--accent); background: rgba(57,211,83,.06); }
    .route-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .route-option-info { flex: 1; }
    .route-option-name { font-size: 12px; font-weight: 600; }
    .route-option-detail { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .route-option-stat { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--accent); }

    /* 요약 카드 */
    .route-cards { display: flex; gap: 8px; }
    .route-card {
      flex: 1; background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 12px 10px; text-align: center;
    }
    .route-card-val { font-size: 20px; font-weight: 700; color: var(--accent); font-family: 'DM Mono', monospace; }
    .route-card-unit { font-size: 10px; color: var(--muted); margin-top: 2px; }

    /* ── 지도 배지 ── */
    #map-badge {
      position: absolute; top: 16px; right: 16px;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 14px;
      font-size: 12px; color: var(--muted);
      pointer-events: none; z-index: 5;
    }
  </style>
</head>
<body>
<div id="app">

  <!-- ── 사이드바 ── -->
  <div id="sidebar">
    <div class="sidebar-header">
      <div class="logo">ROUDI</div>
      <div class="logo-sub">서울 도보 경로 추천 · 은평구 파일럿</div>
    </div>

    <div class="sidebar-body">

      <!-- 루트 유형 -->
      <div class="input-block">
        <div class="section-label">경로 유형</div>
        <div class="route-types">
          <button class="type-btn active" onclick="selectType('loop', this)">
            <span class="type-icon">🔄</span>순환 루트
          </button>
          <button class="type-btn" onclick="selectType('waypoint', this)">
            <span class="type-icon">📍</span>목적지 경유
          </button>
        </div>
      </div>

      <!-- 목적지 입력 (waypoint 전용) -->
      <div class="input-block input-block" id="destinationBlock">
        <div class="section-label">목적지</div>
        <textarea id="destinationInput" rows="1" placeholder="예) 연신내역, 불광천, 은평뉴타운공원"></textarea>
      </div>

      <!-- 조건 입력 -->
      <div class="input-block">
        <div class="section-label">원하는 조건을 자유롭게 말해줘</div>
        <textarea id="nlInput" placeholder="예) 30분 정도 산책하고 싶어&#10;예) 5km 달리고 싶어&#10;예) 연신내역까지 3km로 돌아서 가줘"></textarea>
        <div class="chips">
          <span class="chip" onclick="setChip('🏃 5km 달리기 순환')">🏃 5km 달리기</span>
          <span class="chip" onclick="setChip('유모차 산책 30분')">🧸 유모차 30분</span>
          <span class="chip" onclick="setChip('조용한 자연 코스 1시간')">🌿 자연 코스</span>
          <span class="chip" onclick="setChip('야간 안전한 경로 3km')">🌙 야간 안전</span>
        </div>
      </div>

      <!-- 실행 버튼 -->
      <button id="runBtn" onclick="run()">경로 추천 받기 →</button>

      <!-- 로딩 -->
      <div id="loader"><div class="spinner"></div><span id="loaderText">경로 생성 중...</span></div>

      <!-- 오류 -->
      <div id="errorMsg"></div>

      <!-- 결과 -->
      <div id="resultSection">
        <div class="divider"></div>

        <!-- LLM 설명 -->
        <div class="reply-box" id="replyBox"></div>

        <div class="divider"></div>

        <!-- 루트 후보 -->
        <div class="input-block">
          <div class="section-label">경로 후보</div>
          <div class="route-options" id="routeOptions"></div>
        </div>

        <!-- 요약 카드 -->
        <div class="route-cards" id="routeSummary"></div>
      </div>

    </div>
  </div>

  <!-- ── 지도 ── -->
  <div id="map-container">
    <div id="map"></div>
    <div id="map-badge">📍 서울시 은평구 구파발 · 연신내</div>
  </div>
</div>

<script>
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  //  설정
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  const MAPBOX_TOKEN = 'please enter your mapbox token';
  const API_BASE     = 'http://localhost:8000';

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  //  상태
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  let selectedType   = 'loop';
  let routeLayerIds  = [];
  let currentRoutes  = [];

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  //  지도 초기화
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  mapboxgl.accessToken = MAPBOX_TOKEN;
  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/dark-v11',
    center: [126.9203, 37.6347],
    zoom: 14, pitch: 30, bearing: -10,
  });
  map.addControl(new mapboxgl.NavigationControl(), 'bottom-right');
  map.addControl(new mapboxgl.GeolocateControl({ trackUserLocation: true }), 'bottom-right');
  new mapboxgl.Marker({ color: '#39d353' })
    .setLngLat([126.9203, 37.6347])
    .setPopup(new mapboxgl.Popup().setHTML('<b>📍 출발점</b><br>구파발역'))
    .addTo(map);

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  //  루트 유형 선택
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  function selectType(type, btn) {
    selectedType = type;
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const destBlock = document.getElementById('destinationBlock');
    if (type === 'waypoint') {
      destBlock.classList.add('visible');
    } else {
      destBlock.classList.remove('visible');
      document.getElementById('destinationInput').value = '';
    }
  }

  function setChip(text) {
    document.getElementById('nlInput').value = text;
  }

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  //  루트 렌더링
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  function clearRoutes() {
    routeLayerIds.forEach(id => {
      if (map.getLayer(id))  map.removeLayer(id);
      if (map.getSource(id)) map.removeSource(id);
    });
    routeLayerIds = [];
  }

  function drawRoutes(routes) {
    if (!map.isStyleLoaded()) { map.once('idle', () => drawRoutes(routes)); return; }
    clearRoutes();
    const ts = Date.now();

    routes.forEach((route, i) => {
      const sid = `rs-${route.id}-${ts}`;
      const lid = `rl-${route.id}-${ts}`;

      map.addSource(sid, {
        type: 'geojson',
        data: { type: 'Feature', geometry: { type: 'LineString', coordinates: route.coords } }
      });
      map.addLayer({ id: lid+'-shadow', type: 'line', source: sid,
        layout: { 'line-join':'round','line-cap':'round' },
        paint: { 'line-color': route.color, 'line-width': 12, 'line-opacity': 0.15, 'line-blur': 4 }
      });
      map.addLayer({ id: lid, type: 'line', source: sid,
        layout: { 'line-join':'round','line-cap':'round' },
        paint: {
          'line-color': route.color,
          'line-width': i === 0 ? 4 : 2.5,
          'line-opacity': i === 0 ? 1 : 0.45,
          'line-dasharray': i === 0 ? [1] : [2, 1.5],
        }
      });
      routeLayerIds.push(sid, lid+'-shadow', lid);
      map.on('click', lid, () => selectRoute(route.id));
      map.on('mouseenter', lid, () => map.getCanvas().style.cursor = 'pointer');
      map.on('mouseleave', lid, () => map.getCanvas().style.cursor = '');
    });

    const bounds = new mapboxgl.LngLatBounds();
    routes[0].coords.forEach(c => bounds.extend(c));
    map.fitBounds(bounds, { padding: 60, duration: 800 });
  }

  function selectRoute(id) {
    currentRoutes.forEach(r => {
      const layers = routeLayerIds.filter(l => l.startsWith(`rl-${r.id}-`) && !l.includes('shadow'));
      layers.forEach(lid => {
        if (!map.getLayer(lid)) return;
        map.setPaintProperty(lid, 'line-width',   r.id === id ? 5 : 2);
        map.setPaintProperty(lid, 'line-opacity',  r.id === id ? 1 : 0.3);
      });
    });
    document.querySelectorAll('.route-option').forEach(el => {
      el.classList.toggle('selected', el.dataset.routeId === id);
    });
    const route = currentRoutes.find(r => r.id === id);
    if (route) renderSummary(route);
  }

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  //  결과 렌더링
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  function renderRouteOptions(routes) {
    document.getElementById('routeOptions').innerHTML = routes.map((r, i) => `
      <div class="route-option ${i===0?'selected':''}" data-route-id="${r.id}" onclick="selectRoute('${r.id}')">
        <div class="route-dot" style="background:${r.color}"></div>
        <div class="route-option-info">
          <div class="route-option-name">${r.name}</div>
          <div class="route-option-detail">${r.description}</div>
        </div>
        <div class="route-option-stat">${r.distance_km}km · ${r.minutes}분</div>
      </div>`).join('');
  }

  function renderSummary(route) {
    document.getElementById('routeSummary').innerHTML = `
      <div class="route-card"><div class="route-card-val">${route.distance_km}</div><div class="route-card-unit">km</div></div>
      <div class="route-card"><div class="route-card-val">${route.minutes}</div><div class="route-card-unit">분</div></div>
      <div class="route-card"><div class="route-card-val">${Math.round(route.distance_km*1300)}</div><div class="route-card-unit">걸음</div></div>`;
  }

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  //  메인 실행
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  async function run() {
    const nlInput   = document.getElementById('nlInput').value.trim();
    const destInput = document.getElementById('destinationInput').value.trim();

    // 메시지 조합 — 목적지가 있으면 자연어에 포함시켜서 전달
    let message = nlInput;
    if (selectedType === 'waypoint' && destInput) {
      if (nlInput) {
        message = `${destInput}까지 ${nlInput}`;
      } else {
        message = `${destInput}까지 걸어갈게`;
      }
    }

    if (!message) { showError('조건을 입력해주세요.'); return; }

    document.getElementById('resultSection').classList.remove('visible');
    document.getElementById('errorMsg').classList.remove('visible');
    setLoading(true);

    try {
      const res = await fetch(`${API_BASE}/api/chat-route`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message }),
      });

      if (!res.ok) throw new Error(`서버 오류: ${res.status}`);
      const data = await res.json();

      setLoading(false);

      if (!data.routes || !data.routes.length) {
        showError(data.reply || '경로를 찾지 못했어요.');
        return;
      }

      // 결과 표시
      document.getElementById('replyBox').textContent = data.reply;
      currentRoutes = data.routes;
      renderRouteOptions(data.routes);
      renderSummary(data.routes[0]);
      document.getElementById('resultSection').classList.add('visible');
      drawRoutes(data.routes);

    } catch (err) {
      setLoading(false);
      showError('서버 연결에 실패했어요. 다시 시도해 주세요.');
      console.error(err);
    }
  }

  function setLoading(on) {
    document.getElementById('loader').classList.toggle('visible', on);
    document.getElementById('runBtn').disabled = on;
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.add('visible');
  }

  // Enter 전송
  document.getElementById('nlInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); run(); }
  });
</script>
</body>
</html>
